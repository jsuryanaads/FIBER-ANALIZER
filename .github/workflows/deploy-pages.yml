name: Deploy Fiber Analyzer

on:
  push:
    branches:
      - main
      - feature/fiber-network-foundation
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: fiber-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript tests
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

      - name: Prepare Supabase configuration
        env:
          SUPABASE_URL_SECRET: ${{ secrets.SUPABASE_URL }}
          SUPABASE_URL_VAR: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY_SECRET: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_KEY_VAR: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          URL="${SUPABASE_URL_SECRET:-}"
          KEY="${SUPABASE_KEY_SECRET:-}"
          if [ -z "$URL" ]; then URL="${SUPABASE_URL_VAR:-}"; fi
          if [ -z "$KEY" ]; then KEY="${SUPABASE_KEY_VAR:-}"; fi
          mkdir -p _site
          cp -R app/. _site/
          if [ -n "$URL" ] && [ -n "$KEY" ]; then
            SUPABASE_URL="$URL" SUPABASE_KEY="$KEY" node -e 'const fs=require("fs"); fs.writeFileSync("_site/supabase-config.js", `export const SUPABASE_URL=${JSON.stringify(process.env.SUPABASE_URL)};\nexport const SUPABASE_PUBLISHABLE_KEY=${JSON.stringify(process.env.SUPABASE_KEY)};\n`);'
          fi
          cp _site/index.html _site/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
