name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Validate generator
        run: |
          python3 -m py_compile generator/generate.py
          python3 -m py_compile generator/generator_app.py

      - name: Generate sample Android project
        run: |
          python3 generator/generate.py             --url "https://example.com"             --name "WebVIEW Sample"             --package "com.jsuryana.webviewsample"             --version-name "1.0.0"             --version-code 1             --primary-color "#111827"             --splash-color "#0F172A"

      - name: Verify generated branding and configuration
        working-directory: generated/webview-sample
        run: |
          grep -q 'versionCode = 1' app/build.gradle.kts
          grep -q 'android:icon="@drawable/ic_launcher"' app/src/main/AndroidManifest.xml
          grep -q 'https://example.com' app/src/main/res/values/strings.xml
          test -f app/src/main/res/drawable/ic_launcher.xml

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        working-directory: generated/webview-sample
        run: gradle wrapper --gradle-version 8.13

      - name: Build debug APK
        working-directory: generated/webview-sample
        run: ./gradlew assembleDebug

      - name: Build release APK
        working-directory: generated/webview-sample
        run: ./gradlew assembleRelease

      - name: Build release AAB
        working-directory: generated/webview-sample
        run: ./gradlew bundleRelease

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webview-generator-android-builds
          path: |
            generated/webview-sample/app/build/outputs/apk/debug/*.apk
            generated/webview-sample/app/build/outputs/apk/release/*.apk
            generated/webview-sample/app/build/outputs/bundle/release/*.aab
